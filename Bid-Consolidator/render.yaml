services:
  - type: web
    name: bid-consolidator-api
    runtime: node
    rootDir: Bid-Consolidator/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: uploads
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
